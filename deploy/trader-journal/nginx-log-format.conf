# HTTP context; intentionally no query, account IDs, auth, cookies or client IP.
map $http_x_journal_request_id $journal_client_request_id {
    default "invalid";
    "" "-";
    "~^[a-zA-Z0-9-]{1,64}$" $http_x_journal_request_id;
}
log_format moex_journal escape=json
    '{"at":"$time_iso8601","request_id":"$journal_client_request_id",'
    '"server_id":"$request_id","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_s":"$request_time",'
    '"upstream_s":"$upstream_response_time","upstream_status":"$upstream_status",'
    '"protocol":"$server_protocol","complete":"$request_completion"}';
