# Include inside the existing HTTPS server for breakwood.ru, never as a public unauthenticated alias.
location = /journal { return 308 /journal/; }
location ^~ /journal/ {
    auth_basic "Private trading journal";
    auth_basic_user_file /etc/moex-trader-journal/htpasswd;
    alias /var/lib/moex-trader-journal/public/;
    index index.html;
    autoindex off;
    # Scope compression to the authenticated static journal, not other services.
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    limit_except GET { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
