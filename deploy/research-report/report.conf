[Service]
ExecStart=
ExecStart=/usr/bin/python3 -I -B /usr/local/lib/moex-research-report/forward_report.py --bundle /opt/moex-research-forward-20261112-r2 --state /var/lib/moex-research-forward-v2
# Full-chain verification remains mandatory. Keep CPU/memory isolation unchanged.
TimeoutStartSec=10min
# Report generated, but the frozen protocol explicitly found incomplete evidence.
# This remains a separate failure in bot monitoring rather than a service crash.
SuccessExitStatus=3
# The main process exports non-secret counters for diagnose/Kuma, not READY or watchdog.
NotifyAccess=main
