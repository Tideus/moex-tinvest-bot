# HTTP-only bootstrap for ACME. Replace monitor.example.com before installation.
# Do not enable simultaneously with kuma.conf.
server {
    listen 80;
    server_name monitor.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 404; }
}
