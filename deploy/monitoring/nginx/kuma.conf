# Template: replace domain and TEST-NET IPs. Requires certificate to exist first.
# 203.0.113.10 = bot/collector public egress IP; 203.0.113.20 = admin/VPN egress IP.
server {
    listen 80;
    server_name monitor.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://monitor.example.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name monitor.example.com;
    ssl_certificate /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $kuma_connection_upgrade;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # Push URLs contain bearer-like secrets. Never log them.
    location ^~ /api/push/ {
        allow 203.0.113.10;
        deny all;
        access_log off;
        error_log /dev/null;
        proxy_pass http://kuma_backend;
    }

    # Includes UI, login, socket.io and administrative APIs.
    location / {
        allow 203.0.113.20;
        deny all;
        proxy_pass http://kuma_backend;
    }
}
