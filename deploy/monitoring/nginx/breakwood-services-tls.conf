# Pending: require DNS, certificate and administrator/VPN ACL before enabling.
# Replace the bootstrap site with this file; do NOT enable both.
server {
    listen 80;
    listen [::]:80;
    server_name s3.breakwood.ru sync.breakwood.ru monitoring.breakwood.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name s3.breakwood.ru;
    ssl_certificate /etc/letsencrypt/live/breakwood-services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/breakwood-services/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sync.breakwood.ru;
    ssl_certificate /etc/letsencrypt/live/breakwood-services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/breakwood-services/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Fail closed. Add administrator/VPN addresses before public access.
    allow 127.0.0.1;
    allow ::1;
    deny all;
    location / {
        proxy_pass http://127.0.0.1:8384;
        proxy_set_header Host 127.0.0.1:8384;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitoring.breakwood.ru;
    ssl_certificate /etc/letsencrypt/live/breakwood-services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/breakwood-services/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /api/push/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3001;
    }
    location / {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
