# Bootstrap only: ACME works, application/admin traffic stays disabled until TLS.
server {
    listen 80;
    listen [::]:80;
    server_name s3.breakwood.ru sync.breakwood.ru monitoring.breakwood.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 503; }
}
