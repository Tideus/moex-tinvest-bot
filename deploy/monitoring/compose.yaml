# Preparation template, not deployed. Set KUMA_IMAGE to an approved immutable digest.
services:
  uptime-kuma:
    image: ${KUMA_IMAGE:?Set KUMA_IMAGE to louislam/uptime-kuma@sha256:approved_digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Europe/Moscow
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
