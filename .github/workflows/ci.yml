name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest --cov=moex_bot --cov-report=term-missing --cov-fail-under=75
      - run: python -m moex_bot.cli config-check
      - run: bash scripts/ubuntu/test-deployment.sh
